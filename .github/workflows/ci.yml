name: CI

# lint, typecheck, and build, composed as `pnpm check`. The workflow only runs
# that gate: https://github.com/dabaz-official/.github/blob/main/.github/workflows/web-ci.yml
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: dabaz-official/.github/.github/workflows/web-ci.yml@main

  # scripts/start.mjs is the thing stopping a dev server from poisoning a prod
  # build, so it gets executed here; the shared workflow has no step for it.
  smoke:
    name: start guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Smoke test the start guard
        run: |
          set -euo pipefail

          # 1. A live dev server must block the start, not warn.
          mkdir -p .next/dev
          printf '{"pid":%d,"port":3000}\n' "$$" > .next/dev/lock
          if PORT=3210 pnpm start < /dev/null; then
            echo "::error::start guard did not refuse while a dev lock was live"
            exit 1
          fi
          echo "ok: refused to start while a dev lock was live"
          rm -rf .next/dev

          # 2. With that gone, it must start and answer on /.
          HOSTNAME=127.0.0.1 PORT=3210 pnpm start < /dev/null &
          code=000
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3210/ || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          if [ "$code" != "200" ]; then
            echo "::error::smoke test failed, / returned '$code'"
            exit 1
          fi
          echo "ok: / -> $code"
